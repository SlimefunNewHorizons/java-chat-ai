plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.javachatai'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.javachatai'
            artifactId = 'java-chat-ai'
            version = '1.0.0'

            pom {
                name = 'JavaChatAI'
                description = 'Lightweight conversational AI agent for Java'
                url = 'https://github.com/Chagui68/JavaChatAI'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'local'
            url = uri('C:\\Users\\danie\\.m2\\repository')
        }
    }
}
